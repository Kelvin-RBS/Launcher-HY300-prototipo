# Configuração de exemplo do RetroArch para o projetor HY300 (sem tela de toque).
# Use como arquivo adicional (--appendconfig) ou passe em CONFIGFILE pelo launcher.
# Chaves ATIVAS abaixo: confirmadas na documentação e em fóruns do RetroArch.
# Linhas comentadas (#): sugestões comuns, NÃO testadas neste aparelho.

# Sem controles de toque na tela
input_overlay_enable = "false"
# Sem navegação por ponteiro/mouse nos menus (o controle remoto usa direcional)
menu_pointer_enable = "false"
# Evita que o RetroArch sobrescreva este arquivo ao sair
config_save_on_exit = "false"

# --- Sugestões para testar (hardware modesto, 32 bits, pouca memória) ---
